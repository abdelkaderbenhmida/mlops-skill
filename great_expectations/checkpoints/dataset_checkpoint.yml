name: dataset_checkpoint
config_version: 1.0
class_name: Checkpoint

# The batch_request is supplied at runtime by src/data/validation.py: the
# datasource is a RuntimeDataConnector, so the batch is an in-memory
# dataframe and cannot be declared statically here.
expectation_suite_name: dataset_suite
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: store_evaluation_params
    action:
      class_name: StoreEvaluationParametersAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
